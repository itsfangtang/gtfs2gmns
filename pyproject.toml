[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs2gmns"
version = "0.8.0"
description = "Convert GTFS transit data to GMNS (General Modeling Network Specification) network files."
readme = "README.md"
license = "MIT"
# 3.10+ matches Streamlit 1.51+ and avoids Poetry solving streamlit for 3.8/3.9 (impossible).
requires-python = ">=3.10"
authors = [
  { name = "gtfs2gmns contributors" }
]
keywords = ["gtfs", "gmns", "transit", "transportation", "network"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  # In main deps so hosts (e.g. Streamlit Cloud) that run `poetry install` without extras still get charts.
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
  "build",
  "twine",
]
# For `streamlit run gtfs2gmns_dashboard.py`: pip install ".[dashboard]" (plotly is already a core dep).
# streamlit>=1.51 requires Python >=3.10 (aligned with requires-python above).
dashboard = [
  "streamlit>=1.51,<2",
]

[project.scripts]
gtfs2gmns = "gtfs2gmns:main"

[tool.setuptools]
py-modules = ["gtfs2gmns"]
