[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs2gmns"
version = "0.8.0"
description = "Convert GTFS transit data to GMNS (General Modeling Network Specification) network files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
  { name = "gtfs2gmns contributors" }
]
keywords = ["gtfs", "gmns", "transit", "transportation", "network"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
dev = [
  "build",
  "twine",
]
# For `streamlit run gtfs2gmns_dashboard.py`: pip install ".[dashboard]"
dashboard = [
  "streamlit>=1.28",
  "plotly>=5.18",
]

[project.scripts]
gtfs2gmns = "gtfs2gmns:main"

[tool.setuptools]
py-modules = ["gtfs2gmns"]
